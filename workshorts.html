<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>caleffect | Short Video Work</title>
    <style>
        :root {
            --bg: #0f0f11;
            --card-bg: rgba(184, 184, 184, 0.12); /* Translucent frosted glass panel */
            --accent: #ffffff;
            --text-main: #f5f5f7;
            --text-sub: #a1a1aa;
            --border: rgba(184, 184, 184, 0.25);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .wrapper {
            max-width: 800px;
            width: 100%;
            margin-top: 20px;
        }

        /* Frosted Glass Navigation Bar */
        .nav-bar {
            position: sticky;
            top: 20px;
            z-index: 100;
            background: rgba(184, 184, 184, 0.15);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 30px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.4);
        }

        .home-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 10px 14px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text-main);
            text-decoration: none;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .home-btn svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        .home-btn:hover {
            background: var(--accent);
            color: #000000;
            border-color: var(--accent);
            transform: translateY(-1px);
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.25);
        }

        .page-title {
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 20px;
            text-align: left;
            padding-left: 5px;
        }

        /* Frosted Glass Content Box */
        .content-box {
            background: var(--card-bg);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 50px 35px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.4);
            text-align: center;
            color: var(--text-sub);
        }

        footer {
            margin-top: auto;
            padding: 30px 0 10px 0;
            text-align: center;
            color: var(--text-sub);
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <nav class="nav-bar">
            <a href="index.html" class="home-btn" title="Back to Home">
                <span>←</span>
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 576 512">
                    <path d="M575.8 255.5c0 18-15 32.1-32 32.1h-32l.7 160.2c0 17-14 32.1-31 32.1h-96c-17 0-32-15-32-32V352h-64v96c0 17-15 32-32 32H128c-17 0-31-15-31-32l.7-160.2H65c-17 0-32-14.1-32-32.1 0-9 3-17 10-24L267.3 14.3c11.6-11 31.8-11 43.4 0l224.3 217.2c7.2 7 10.8 15 10.8 24z"/>
                </svg>
            </a>
        </nav>

        <h1 class="page-title">Short Video Work</h1>

        <main class="content-box">
            <p style="font-size: 1.1rem; color: var(--text-sub);">Work in progress</p>
        </main>

        <footer>
            <p>I love my girlfriend :P</p>
        </footer>
    </div>

</body>
</html>
