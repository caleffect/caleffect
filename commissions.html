<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>caleffect | Commissions</title>
    <style>
        :root {
            --bg: #0f0f11;
            --card-bg: #18181c;
            --accent: #ffffff;
            --text-main: #f0f0f3;
            --text-sub: #a0a0aa;
            --border: #2a2a32;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .wrapper {
            max-width: 800px;
            width: 100%;
            margin-top: 20px;
        }

        .nav-bar {
            position: sticky;
            top: 20px;
            z-index: 100;
            background: rgba(24, 24, 28, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 30px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.4);
            flex-wrap: wrap;
            gap: 12px;
        }

        .home-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 10px 14px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text-main);
            text-decoration: none;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .home-btn svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        .home-btn:hover {
            background: var(--accent);
            color: #000000;
            border-color: var(--accent);
            transform: translateY(-1px);
        }

        .nav-links {
            display: flex;
            gap: 8px;
        }

        .nav-link-btn {
            padding: 8px 16px;
            background: transparent;
            border: 1px solid transparent;
            border-radius: 12px;
            color: var(--text-sub);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .nav-link-btn:hover {
            color: var(--accent);
            background: rgba(255, 255, 255, 0.05);
            border-color: var(--border);
        }

        .page-title {
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 20px;
            text-align: left;
            padding-left: 5px;
        }

        .content-box {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.3);
            margin-bottom: 30px;
            scroll-margin-top: 100px;
        }

        .section-header {
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 10px;
            color: var(--text-main);
        }

        .section-subtitle {
            color: var(--text-sub);
            font-size: 0.95rem;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .sub-heading {
            font-size: 1.15rem;
            font-weight: 600;
            margin: 25px 0 12px 0;
            color: var(--text-main);
            border-left: 3px solid var(--accent);
            padding-left: 10px;
        }

        .steps-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .step-item {
            display: flex;
            gap: 18px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border);
            padding: 20px;
            border-radius: 14px;
        }

        .step-number {
            min-width: 32px;
            height: 32px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--border);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.9rem;
            color: var(--accent);
        }

        .step-content h3 {
            font-size: 1.1rem;
            margin-bottom: 6px;
            color: var(--text-main);
        }

        .step-content p {
            color: var(--text-sub);
            font-size: 0.92rem;
            line-height: 1.6;
        }

        .deposit-list {
            list-style: none;
            margin-bottom: 25px;
        }

        .deposit-list li {
            position: relative;
            padding-left: 20px;
            margin-bottom: 8px;
            color: var(--text-sub);
            font-size: 0.95rem;
        }

        .deposit-list li::before {
            content: "•";
            position: absolute;
            left: 0;
            color: var(--accent);
            font-weight: bold;
        }

        /* Pricing Matrix Table */
        .table-container {
            width: 100%;
            overflow-x: auto;
            margin: 20px 0 30px 0;
            border: 1px solid var(--border);
            border-radius: 14px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
            font-size: 0.92rem;
        }

        th, td {
            padding: 14px 16px;
            border: 1px solid var(--border);
            color: var(--text-sub);
        }

        /* Top Header Row */
        th {
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-main);
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
        }

        /* First Column (Row Labels) */
        .row-label {
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-main);
            font-weight: 600;
            text-align: left;
            width: 32%;
        }

        /* Optional Project File Row (Slightly Transparent / Distinct) */
        .optional-row td {
            background: rgba(255, 255, 255, 0.015);
            color: #888894;
            font-style: italic;
        }

        .optional-row .row-label {
            background: rgba(255, 255, 255, 0.02);
            color: #a0a0aa;
        }

        /* Fee Cards */
        .fees-grid {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 15px;
        }

        .fee-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 18px;
        }

        .fee-card h4 {
            color: var(--text-main);
            font-size: 1rem;
            margin-bottom: 6px;
        }

        .fee-card p {
            color: var(--text-sub);
            font-size: 0.9rem;
            line-height: 1.5;
        }

        footer {
            margin-top: auto;
            padding: 30px 0 10px 0;
            text-align: center;
            color: var(--text-sub);
            font-size: 0.8rem;
        }
    </style>
</head>
