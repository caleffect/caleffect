<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>caleffect | Commissions</title>
    <style>
        :root {
            --bg: #0f0f11;
            --card-bg: #18181c;
            --accent: #ffffff;
            --text-main: #f0f0f3;
            --text-sub: #a0a0aa;
            --border: #2a2a32;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .wrapper {
            max-width: 700px;
            width: 100%;
            margin-top: 20px;
        }

        .content-box {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.3);
            text-align: center;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 15px;
        }

        p {
            color: var(--text-sub);
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .back-btn {
            display: inline-block;
            padding: 12px 24px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text-main);
            text-decoration: none;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .back-btn:hover {
            background: var(--accent);
            color: #000000;
            border-color: var(--accent);
        }

        footer {
            margin-top: auto;
            padding: 30px 0 10px 0;
            text-align: center;
            color: var(--text-sub);
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <div class="content-box">
            <h1>✦ Edit Commissions ✦</h1>
            <p>This is a test page for your Edit Commissions info!</p>
            <a href="index.html" class="back-btn">← Back to Home</a>
        </div>

        <footer>
            <p>© 2026 • caleffect</p>
        </footer>
    </div>

</body>
</html>
