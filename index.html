<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>caleffect | Services</title>
    <style>
        :root {
            --bg-color: #B8B8B8;
            --card-bg: rgba(20, 20, 24, 0.65); /* Translucent frosted glass panel */
            --accent: #ffffff;
            --text-main: #f5f5f7;
            --text-sub: #a1a1aa;
            --border: rgba(255, 255, 255, 0.15);
            --green: #4ade80;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            /* Subtle background gradient for depth under the glass blur */
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(255, 255, 255, 0.25) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(0, 0, 0, 0.15) 0%, transparent 50%);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .wrapper {
            max-width: 700px;
            width: 100%;
            margin-top: 20px;
        }

        /* Frosted Glass Header Box */
        header {
            text-align: center;
            padding: 40px 20px;
            background: var(--card-bg);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid var(--border);
            border-radius: 24px;
            margin-bottom: 25px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.25);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Avatar with Glowing White Aura */
        .avatar-img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 16px;
            border: 3px solid #ffffff;
            /* Multi-layered white aura glow surrounding avatar */
            box-shadow: 
                0 0 20px rgba(255, 255, 255, 0.8),
                0 0 40px rgba(255, 255, 255, 0.4),
                0 0 60px rgba(255, 255, 255, 0.2);
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.3s ease;
        }

        .avatar-img:hover {
            transform: scale(1.03);
            box-shadow: 
                0 0 25px rgba(255, 255, 255, 1),
                0 0 50px rgba(255, 255, 255, 0.6),
                0 0 75px rgba(255, 255, 255, 0.3);
        }

        .avatar-img:active {
            transform: scale(0.96);
        }

        h1 {
            font-size: 2rem;
            letter-spacing: -0.5px;
            margin-bottom: 12px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        /* Social Links */
        .socials {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 4px;
        }

        .social-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 42px;
            height: 42px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--border);
            border-radius: 50%;
            color: var(--text-main);
            transition: all 0.2s ease;
            text-decoration: none;
        }

        .social-icon svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        .social-icon:hover {
            background: var(--accent);
            color: #000000;
            border-color: var(--accent);
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.3);
        }

        /* Frosted Glass Services Container */
        .services-box {
            background: var(--card-bg);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.25);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Linktree Style Card Items */
        .service-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 22px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            color: var(--text-main);
            text-decoration: none;
            font-size: 1.05rem;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .service-card:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: var(--accent);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
        }

        /* Status Indicators */
        .status-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .status-text.open {
            color: rgba(255, 255, 255, 0.95);
        }

        .status-text.closed {
            color: rgba(255, 255, 255, 0.4);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }

        .status-dot.active {
            background-color: var(--green);
            box-shadow: 0 0 10px var(--green);
        }

        .status-dot.inactive {
            background-color: rgba(255, 255, 255, 0.25);
        }

        /* Toast Popup */
        .toast-popup {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(20, 20, 24, 0.9);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 12px 22px;
            border-radius: 30px;
            font-size: 0.88rem;
            font-weight: 500;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(12px);
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 1000;
        }

        .toast-popup.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        footer {
            margin-top: auto;
            padding: 30px 0 10px 0;
            text-align: center;
            color: #2e2e33;
            font-weight: 600;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <header>
            <img src="ccat pfp.png" alt="caleffect avatar" class="avatar-img" onclick="showGirlfriendToast()" title="Click me!">
            <h1>caleffect</h1>
            
            <div class="socials">
                <!-- Ko-fi Icon (First) -->
                <a href="https://ko-fi.com/caleffect" target="_blank" rel="noopener noreferrer" class="social-icon" title="Support on Ko-fi">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                        <path d="M23.881 8.948c-.773-4.085-4.859-4.593-4.859-4.593H.723c-.604 0-.679.798-.679.798s-.082 7.324-.022 11.822c.164 2.424 2.586 2.672 2.586 2.672s8.267-.023 11.966-.049c2.438-.426 2.683-2.566 2.658-3.734 4.352.24 7.422-2.831 6.649-6.916zm-11.062 3.511c-1.246 1.192-3.211 2.223-3.211 2.223s-1.965-1.031-3.211-2.223c-1.391-1.332-1.205-3.056.128-3.953 1.333-.896 2.871.303 3.083.567.212-.264 1.75-1.463 3.083-.567 1.333.897 1.519 2.621.128 3.953zm5.006.183c-.015.659-.286 1.488-1.572 1.621.015-.956.03-1.93.037-2.812 1.385-.028 1.55.518 1.535 1.191z"/>
                    </svg>
                </a>

                <!-- TikTok Icon (Second) -->
                <a href="https://www.tiktok.com/@caleffect" target="_blank" rel="noopener noreferrer" class="social-icon" title="TikTok">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512">
                        <path d="M448 209.91a210.06 210.06 0 0 1-122.77-39.25V349.38A162.55 162.55 0 1 1 185 188.31V278.2a74.62 74.62 0 1 0 52.23 71.18V0l88 0a121.18 121.18 0 0 0 1.86 22.17h0A122.18 122.18 0 0 0 381 102.39a121.43 121.43 0 0 0 67 20.14z"/>
                    </svg>
                </a>
            </div>
        </header>

        <!-- Main Services Box -->
        <main class="services-box">
            <a href="commissions.html" class="service-card">
                <span>Commissions</span>
                <div class="status-wrapper">
                    <span class="status-text open">OPEN</span>
                    <span class="status-dot active"></span>
                </div>
            </a>

            <a href="audiopromo.html" class="service-card">
                <span>Audio Promo</span>
                <div class="status-wrapper">
                    <span class="status-text closed">CLOSED</span>
                    <span class="status-dot inactive"></span>
                </div>
            </a>

            <a href="publicity.html" class="service-card">
                <span>Publicity</span>
                <div class="status-wrapper">
                    <span class="status-text closed">CLOSED</span>
                    <span class="status-dot inactive"></span>
                </div>
            </a>

            <a href="workshorts.html" class="service-card">
                <span>Short Video Work</span>
                <div class="status-wrapper">
                    <span class="status-text closed">CLOSED</span>
                    <span class="status-dot inactive"></span>
                </div>
            </a>

            <a href="worklongshtml" class="service-card">
                <span>Long Video Work</span>
                <div class="status-wrapper">
                    <span class="status-text closed">CLOSED</span>
                    <span class="status-dot inactive"></span>
                </div>
            </a>
        </main>

        <footer>
            <p>i love my girlfriend • caleffect</p>
        </footer>
    </div>

    <!-- Girlfriend Easter Egg Toast Pop-up -->
    <div id="girlfriend-toast" class="toast-popup">
        <span>✨ my girlfriend helped me design this hehe</span>
    </div>

    <script>
        let toastTimeout;
        function showGirlfriendToast() {
            const toast = document.getElementById('girlfriend-toast');
            toast.classList.add('show');
            
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }
    </script>
</body>
</html>
