<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>caleffect | Services</title>
    <style>
        :root {
            --bg: #0f0f11;
            --card-bg: #18181c;
            --accent: #ffffff;
            --text-main: #f0f0f3;
            --text-sub: #a0a0aa;
            --border: #2a2a32;
            --green: #4ade80;
            --red: #f87171;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        /* Container */
        .wrapper {
            max-width: 700px;
            width: 100%;
            margin-top: 20px;
        }

        /* Header */
        header {
            text-align: center;
            padding: 40px 20px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            margin-bottom: 25px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .avatar-img {
            width: 95px;
            height: 95px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 15px;
            border: 2px solid var(--accent);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.1);
        }

        h1 {
            font-size: 2rem;
            letter-spacing: -0.5px;
            margin-bottom: 12px;
        }

        /* Social Links */
        .socials {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 4px;
        }

        .social-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 42px;
            height: 42px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            border-radius: 50%;
            color: var(--text-main);
            transition: all 0.2s ease;
            text-decoration: none;
        }

        .social-icon svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        .social-icon:hover {
            background: var(--accent);
            color: #000000;
            border-color: var(--accent);
            transform: translateY(-2px);
        }

        /* Services Box */
        .services-box {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* Service Button Cards */
        .service-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 24px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: 14px;
            color: var(--text-main);
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: 600;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        /* Hover effect for available services */
        .service-card.available:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--accent);
            transform: translateY(-2px);
        }

        /* Disabled state for unavailable services */
        .service-card.unavailable {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Badges */
        .badge {
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            padding: 4px 10px;
            border-radius: 20px;
            text-transform: uppercase;
        }

        .badge.available {
            color: var(--green);
            background: rgba(74, 222, 128, 0.1);
            border: 1px solid rgba(74, 222, 128, 0.3);
        }

        .badge.unavailable {
            color: var(--red);
            background: rgba(248, 113, 113, 0.1);
            border: 1px solid rgba(248, 113, 113, 0.3);
        }

        /* Footer */
        footer {
            margin-top: auto;
            padding: 30px 0 10px 0;
            text-align: center;
            color: var(--text-sub);
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <header>
            <img src="ccat pfp.png" alt="caleffect avatar" class="avatar-img">
            <h1>caleffect</h1>
            
            <div class="socials">
                <a href="https://www.tiktok.com/@caleffect" target="_blank" rel="noopener noreferrer" class="social-icon" title="TikTok">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512">
                        <path d="M448 209.91a210.06 210.06 0 0 1-122.77-39.25V349.38A162.55 162.55 0 1 1 185 188.31V278.2a74.62 74.62 0 1 0 52.23 71.18V0l88 0a121.18 121.18 0 0 0 1.86 22.17h0A122.18 122.18 0 0 0 381 102.39a121.43 121.43 0 0 0 67 20.14z"/>
                    </svg>
                </a>
            </div>
        </header>

        <!-- Main Services Box -->
        <main class="services-box">
            <!-- Available Option linking to commissions.html -->
            <a href="commissions.html" class="service-card available">
                <span>Commissions</span>
                <span class="badge available">Available</span>
            </a>

            <!-- Unavailable Options -->
            <div class="service-card unavailable">
                <span>Audio Promo</span>
                <span class="badge unavailable">Unavailable</span>
            </div>

            <div class="service-card unavailable">
                <span>Publicity</span>
                <span class="badge unavailable">Unavailable</span>
            </div>

            <div class="service-card unavailable">
                <span>Short Video Work</span>
                <span class="badge unavailable">Unavailable</span>
            </div>

            <div class="service-card unavailable">
                <span>Long Video Work</span>
                <span class="badge unavailable">Unavailable</span>
            </div>
        </main>

        <footer>
            <p>© 2026 • caleffect</p>
        </footer>
    </div>

</body>
</html>
