<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>caleffect | Commissions</title>
    <style>
        :root {
            --bg: #0f0f11;
            --card-bg: #18181c;
            --accent: #ffffff;
            --text-main: #f0f0f3;
            --text-sub: #a0a0aa;
            --border: #2a2a32;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        /* Container */
        .wrapper {
            max-width: 900px;
            width: 100%;
            margin-top: 20px;
        }

        /* Header */
        header {
            text-align: center;
            padding: 40px 20px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            margin-bottom: 25px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .avatar-img {
            width: 95px;
            height: 95px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 15px;
            border: 2px solid var(--accent);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.1);
        }

        h1 {
            font-size: 2rem;
            letter-spacing: -0.5px;
            margin-bottom: 12px;
        }

        /* Social Links */
        .socials {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 4px;
        }

        .social-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 42px;
            height: 42px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            border-radius: 50%;
            color: var(--text-main);
            transition: all 0.2s ease;
            text-decoration: none;
        }

        .social-icon svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        .social-icon:hover {
            background: var(--accent);
            color: #000000;
            border-color: var(--accent);
            transform: translateY(-2px);
        }

        /* Navigation */
        nav {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .nav-btn {
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text-sub);
            padding: 10px 20px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }

        .nav-btn:hover, .nav-btn.active {
            color: var(--accent);
            border-color: var(--accent);
            background: #22222a;
        }

        /* Content Sections */
        .tab-content {
            display: none;
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.3);
        }

        .tab-content.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h2 {
            font-size: 1.3rem;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
        }

        /* Footer */
        footer {
            margin-top: auto;
            padding: 30px 0 10px 0;
            text-align: center;
            color: var(--text-sub);
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <header>
            <img src="ccat pfp.png" alt="caleffect avatar" class="avatar-img">
            <h1>caleffect</h1>
            
            <div class="socials">
                <a href="https://www.tiktok.com/@caleffect" target="_blank" rel="noopener noreferrer" class="social-icon" title="TikTok">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512">
                        <path d="M448 209.91a210.06 210.06 0 0 1-122.77-39.25V349.38A162.55 162.55 0 1 1 185 188.31V278.2a74.62 74.62 0 1 0 52.23 71.18V0l88 0a121.18 121.18 0 0 0 1.86 22.17h0A122.18 122.18 0 0 0 381 102.39a121.43 121.43 0 0 0 67 20.14z"/>
                    </svg>
                </a>
            </div>
        </header>

        <nav>
            <button class="nav-btn active" onclick="switchTab('process')">Process</button>
            <button class="nav-btn" onclick="switchTab('pricing')">Pricing</button>
            <button class="nav-btn" onclick="switchTab('tos')">Terms of Service</button>
        </nav>

        <!-- Process Page -->
        <section id="process" class="tab-content active">
            <h2>Information & Guidelines</h2>
            <p style="color: var(--text-sub);">Simple 5-step process overview coming soon...</p>
        </section>

        <!-- Pricing Page -->
        <section id="pricing" class="tab-content">
            <h2>Pricing & Payment Details</h2>
            <p style="color: var(--text-sub);">Interactive duration & complexity price table coming soon...</p>
        </section>

        <!-- TOS Page -->
        <section id="tos" class="tab-content">
            <h2>Terms of Service & Policies</h2>
            <p style="color: var(--text-sub);">Detailed policies and guidelines coming soon...</p>
        </section>

        <footer>
            <p>© 2026 • caleffect</p>
        </footer>
    </div>

    <script>
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            
            document.getElementById(tabId).classList.add('active');
            event.target.classList.add('active');
        }
    </script>
</body>
</html>
